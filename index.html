<html lang="en">
<head>

  <title>Truth Shield — Free Disinformation Detector</title>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    header span.sub { font-size: 0.85rem; color: #718096; }
    main { max-width: 780px; margin: 40px auto; padding: 0 20px; }
    .hero { text-align: center; margin-bottom: 40px; }

    .hero p { color: #a0aec0; font-size: 1.05rem; max-width: 500px; margin: 0 auto; line-height: 1.6; }

    textarea { width: 100%; min-height: 160px; background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; color: #e2e8f0; font-size: 1rem; padding: 14px; resize: vertical; outline: none; font-family: inherit; line-height: 1.6; }
    textarea:focus { border-color: #4299e1; }
    textarea::placeholder { color: #4a5568; }
    .btn { width: 100%; margin-top: 16px; padding: 14px; background: linear-gradient(135deg, #3182ce, #2b6cb0); color: #fff; font-size: 1rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { display: none; }
    .risk-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .risk-emoji { font-size: 2.2rem; }
    .risk-label { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .risk-score { font-size: 0.95rem; color: #a0aec0; }
    .score-bar-wrap { background: #0f1117; border-radius: 999px; height: 10px; margin-bottom: 24px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 999px; }
    .section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin-bottom: 8px; }
    .verdict { font-size: 1.05rem; color: #e2e8f0; margin-bottom: 20px; line-height: 1.6; }
    .signals { list-style: none; margin-bottom: 20px; }
    .signals li { background: #0f1117; border-left: 3px solid #e53e3e; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 0.95rem; color: #cbd5e0; }
    .signals li.safe { border-left-color: #38a169; }
    .explanation { color: #a0aec0; line-height: 1.7; font-size: 0.98rem; margin-bottom: 20px; }
    .recommendation { background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; padding: 14px 16px; font-size: 0.95rem; color: #68d391; line-height: 1.6; }
